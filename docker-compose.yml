version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: modelmesh-postgres
    environment:
      POSTGRES_USER: modelmesh
      POSTGRES_PASSWORD: modelmesh
      POSTGRES_DB: modelmesh
    ports:
      - '5432:5432'
    volumes:
      - modelmesh-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U modelmesh']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: modelmesh-redis
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - modelmesh-redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  modelmesh-pgdata:
  modelmesh-redisdata:
